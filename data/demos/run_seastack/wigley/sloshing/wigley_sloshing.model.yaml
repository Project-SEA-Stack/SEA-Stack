chrono-version: 10.0

# Small (10 m) Wigley hull for the coupled sloshing demo, so the ship and the
# 1.5 m deck tank fit in one view. Mass/inertia are the BEM equilibrium values
# for L=10, B=2.4, T=0.7, F=0.7 (rho=1025): mass = (4/9)*rho*L*B*T = 7653 kg,
# Ixx = m*(0.35B)^2, Iyy=Izz = m*(0.25L)^2, CoG z = -T/2. The mesh + BEM h5 live
# in ../assets_small (generated by generate_meshes.py + run_bem_directional.py;
# kept separate from the shared 50 m wigley/spreading assets). For the coupled
# case the runner reduces this structural mass by the tank fluid mass so the
# ship floats at the linearization point.
model:
  name: wigley_sloshing_model
  angle_degrees: false

  data_path:
    type: RELATIVE
    root: "."

  bodies:
    - name: body1
      location: [0, 0, 0]
      mass: 7653
      fixed: false
      inertia:
        moments: [5400.0, 47833.0, 47833.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, -0.35]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets_small/geometry/wigley.obj
        color: [0.92, 0.72, 0.12]

    # Ground reference body
    - name: ground
      location: [0, 0, -10]
      mass: 1
      fixed: true
      inertia:
        moments: [1, 1, 1]
        products: [0, 0, 0]
      com:
        location: [0, 0, 0]
        orientation: [0, 0, 0]
