chrono-version: 10.0
type: FSI

# A rigid cylinder released above a column of water, resolved with SPH.
# Based on Chrono's data/yaml/fsi/objectdrop example.

mbs:   "mbs.yaml"
fluid: "sph.yaml"

fsi:
  name: SEA-Stack object drop (SPH)
  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "."

  fsi_bodies:
    - name: object
      shapes:
        - type: CYLINDER
          dimensions: [0.9, 0.9, 0.15]
          location: [0, 0, 0]
          axis: [1, 0, 0]
          radius: 0.12
          length: 0.20

simulation:
  time_step: 1e-4
  # Finite end time so headless (--nogui) runs terminate. Increase for a longer
  # simulation; a GUI run continues until the window is closed.
  end_time: 0.5
  gravity: [0, 0, -9.8]

visualization:
  render_fps: 120
  enable_shadows: false
  camera:
    vertical: Z
    location: [2, 2, 1.8]
    target: [0, 0, 0.6]
