chrono-version: 10.0

model:
  name: Box water tank
  physics_problem: CFD
  geometry_type: CARTESIAN

  angle_degrees: true

  data_path:
    type: RELATIVE
    root: "."

  fluid_properties:
    density: 1000.0
    viscosity: 1.0
    characteristic_length: 1.0

  initial_states:
    depth_based_pressure: true
    zero_height: 1.2

  fluid_domain:
    # Box domain (CARTESIAN)
    dimensions: [0.8, 0.8, 1.2]
    box_origin: [0, 0, 0]
    box_walls:
      x: [true, true]   # negative, positive
      y: [true, true]   # negative, positive
      z: [true, false]  # negative, positive
