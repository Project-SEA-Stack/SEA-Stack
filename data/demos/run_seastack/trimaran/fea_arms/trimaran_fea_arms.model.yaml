chrono-version: 10.0

# Same three hulls as ../rigid; the cross-arms are Chrono::FEA beams defined in
# trimaran_fea_arms.structure.yaml, so there are no arm bodies or joints here.
model:
  name: trimaran_fea_arms_model
  angle_degrees: false

  data_path:
    type: RELATIVE
    root: "."

  bodies:
    # Center hull (H5 body1); CoG world z = -1.75 m.
    - name: body1
      location: [0.0, 0.0, -1.75]
      mass: 956667.0
      fixed: false
      inertia:
        moments: [16875600.0, 149479167.0, 149479167.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, 0]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets/geometry/center.obj
        color: [0.95, 0.42, 0.10]
        shape_location: [0.0, 0.0, 1.75]

    # Starboard outrigger (H5 body2) at y = -15 m.
    - name: body2
      location: [0.0, -15.0, -0.75]
      mass: 68333.0
      fixed: false
      inertia:
        moments: [133933.0, 2669271.0, 2669271.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, 0]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets/geometry/outrigger.obj
        color: [0.95, 0.42, 0.10]
        shape_location: [0.0, 0.0, 0.75]

    # Port outrigger (H5 body3) at y = +15 m.
