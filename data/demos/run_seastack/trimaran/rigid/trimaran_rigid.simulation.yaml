chrono-version: 9.0

simulation:
  contact_method: SMC

  time_step: 0.02
  end_time: 200.0
  enforce_realtime: false
  gravity: [0, 0, -9.81]

  integrator:
    type: HHT
    rel_tolerance: 1.0e-6
    abs_tolerance_states: 1.0e-6
    abs_tolerance_multipliers: 1.0e-4
    max_iterations: 180
    use_stepsize_control: false
    use_modified_newton: false

  solver:
    type: SPARSE_LU

  visualization:
    type: MODEL_FILE
    render_fps: 120
    enable_shadows: true
    camera:
      vertical: Z
