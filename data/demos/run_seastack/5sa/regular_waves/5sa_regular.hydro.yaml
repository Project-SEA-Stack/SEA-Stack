hydrodynamics:
  bodies:
    - name: body1
      h5_file: ../assets/hydroData/5sa.h5
    - name: body2
      h5_file: ../assets/hydroData/5sa.h5
    - name: body3
      h5_file: ../assets/hydroData/5sa.h5
    - name: body4
      h5_file: ../assets/hydroData/5sa.h5
    - name: body5
      h5_file: ../assets/hydroData/5sa.h5

  waves:
    type: regular
    height: 2.0
    period: 10.0

  radiation:
    method: rirf_convolution
    smoothing:
      type: sg
      window_length: 5
    taper:
      start_percent: 0.8
      end_percent: 1.0
      final_amplitude: 0.0
    diagnostics:
      export_csv: true
