chrono-version: 10.0

model:
  name: "5SA_bimodal_model"
  angle_degrees: false

  data_path:
    type: RELATIVE
    root: "."

  bodies:
    # Segment 1 (Nose)
    - name: body1
      location: [18.0, 0.0, -0.259199]
      mass: 270000
      fixed: false
      inertia:
        moments: [540000.0, 29430000.0, 29430000.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, -0.2]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets/geometry/segment_1.obj
        color: [0.15, 0.35, 0.65]

    # Segment 2
    - name: body2
      location: [54.0, 0.0, -0.259199]
      mass: 270000
      fixed: false
      inertia:
        moments: [540000.0, 29430000.0, 29430000.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, -0.2]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets/geometry/segment_2.obj
        color: [0.20, 0.45, 0.70]

    # Segment 3 (Middle)
    - name: body3
      location: [90.0, 0.0, -0.259199]
      mass: 270000
      fixed: false
      inertia:
        moments: [540000.0, 29430000.0, 29430000.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, -0.2]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets/geometry/segment_3.obj
        color: [0.25, 0.55, 0.75]

    # Segment 4
    - name: body4
      location: [126.0, 0.0, -0.259199]
      mass: 270000
      fixed: false
      inertia:
        moments: [540000.0, 29430000.0, 29430000.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, -0.2]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets/geometry/segment_4.obj
        color: [0.20, 0.45, 0.70]

    # Segment 5 (Tail)
    - name: body5
      location: [162.0, 0.0, -0.259199]
      mass: 270000
      fixed: false
      inertia:
        moments: [540000.0, 29430000.0, 29430000.0]
        products: [0, 0, 0]
      com:
        location: [0, 0, -0.2]
        orientation: [0, 0, 0]
      visualization:
        model_file: ../assets/geometry/segment_5.obj
        color: [0.15, 0.35, 0.65]

    # Ground reference body
    - name: ground
      location: [90, 0, -10]
      mass: 1
      fixed: true
      inertia:
        moments: [1, 1, 1]
        products: [0, 0, 0]
      com:
        location: [0, 0, 0]
        orientation: [0, 0, 0]

  joints:
    - name: joint_12
      type: UNIVERSAL
      body1: body1
      body2: body2
      location: [36.0, 0.0, -0.259199]
      axis1: [0, 1, 0]
      axis2: [0, 0, 1]

    - name: joint_23
      type: UNIVERSAL
      body1: body2
      body2: body3
      location: [72.0, 0.0, -0.259199]
      axis1: [0, 1, 0]
      axis2: [0, 0, 1]

    - name: joint_34
      type: UNIVERSAL
      body1: body3
      body2: body4
      location: [108.0, 0.0, -0.259199]
      axis1: [0, 1, 0]
      axis2: [0, 0, 1]

    - name: joint_45
      type: UNIVERSAL
      body1: body4
      body2: body5
      location: [144.0, 0.0, -0.259199]
      axis1: [0, 1, 0]
      axis2: [0, 0, 1]

  tsdas:
    # 4 hydraulic rams per joint in a cross pattern (top/bottom/port/starboard),
    # arranged at 1.5 m offset from the joint axis, 1 m either side of the joint
    # in x.  free_length = 2 m.  Moment arm = 1.5 m.
    # Per-joint equivalent rotational damping (2 active rams per axis):
    #   pitch ~ 2 * damping * 1.5^2,  yaw ~ 2 * damping * 1.5^2.

    # ---- Joint 1-2 (x = 36) ----
    - name: ram_12_top
      type: TSDA
      body1: body1
      body2: body2
      point1: [35.0, 0.0, 1.240801]
      point2: [37.0, 0.0, 1.240801]
      spring_coefficient: 100000
      damping_coefficient: 2000000
      free_length: 2.0
      visualization: { type: SPRING, radius: 0.15, resolution: 65, turns: 10 }

    - name: ram_12_bottom
      type: TSDA
      body1: body1
      body2: body2
      point1: [35.0, 0.0, -1.759199]
      point2: [37.0, 0.0, -1.759199]
      spring_coefficient: 100000
      damping_coefficient: 2000000
      free_length: 2.0
      visualization: { type: SPRING, radius: 0.15, resolution: 65, turns: 10 }

    - name: ram_12_port
      type: TSDA
      body1: body1
      body2: body2
      point1: [35.0, 1.5, -0.259199]
      point2: [37.0, 1.5, -0.259199]
      spring_coefficient: 100000
      damping_coefficient: 2000000
      free_length: 2.0
      visualization: { type: SPRING, radius: 0.15, resolution: 65, turns: 10 }

    - name: ram_12_stbd
      type: TSDA
      body1: body1
      body2: body2
      point1: [35.0, -1.5, -0.259199]
      point2: [37.0, -1.5, -0.259199]
      spring_coefficient: 100000
      damping_coefficient: 2000000
      free_length: 2.0
      visualization: { type: SPRING, radius: 0.15, resolution: 65, turns: 10 }

    # ---- Joint 2-3 (x = 72) ----
    - name: ram_23_top
      type: TSDA
      body1: body2
      body2: body3
      point1: [71.0, 0.0, 1.240801]
      point2: [73.0, 0.0, 1.240801]
      spring_coefficient: 100000
      damping_coefficient: 2000000
      free_length: 2.0
