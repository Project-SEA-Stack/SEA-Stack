hydrodynamics:
  bodies:
    - name: body1
      h5_file: ../assets/hydroData/5sa.h5
    - name: body2
      h5_file: ../assets/hydroData/5sa.h5
    - name: body3
      h5_file: ../assets/hydroData/5sa.h5
    - name: body4
      h5_file: ../assets/hydroData/5sa.h5
    - name: body5
      h5_file: ../assets/hydroData/5sa.h5

  waves:
    type: irregular
    height: 3.0
    period: 10.0
    seed: 42
    discretization:
      n_omega: 512
  radiation:
    method: rirf_convolution
    smoothing:
      type: sg
      window_length: 5
    taper:
      start_percent: 0.8
      end_percent: 1.0
      final_amplitude: 0.0
    diagnostics:
      export_csv: true

  moordyn:
    enabled: true
    input_file: mooring/lines_5sa.txt
    bodies: [body1, body3]
