chrono-version: 10.0
simulation:
  contact_method: SMC
  time_step: 0.001
  end_time: 8.0
  enforce_realtime: false
  gravity: [0, 0, -9.81]
  integrator:
    type: EULER_IMPLICIT_LINEARIZED
    time_step: 0.001
  solver:
    type: SPARSE_LU          # FEA needs a direct (or MINRES) solver
    lock_sparsity_pattern: true
  visualization:
    type: MODEL_FILE
    render_fps: 30
    camera:
      vertical: Z
      location: [3.0, -8.0, 5.0]
      target: [3.0, 0.0, 3.5]
