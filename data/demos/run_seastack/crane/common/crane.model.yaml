  tsdas:
    - name: station_keeping_surge
      type: TSDA
      body1: ground
      body2: body1
      point1: [0.000000, 0.000000, -1.750000]
      point2: [0.000000, 0.000000, -1.750000]
      spring_coefficient: 8.0e4
      damping_coefficient: 8.0e4
      free_length: 0.0
    - name: station_keeping_sway
      type: TSDA
      body1: ground
      body2: body1
      point1: [0.0, 1.0, -1.75]
      point2: [0.0, 1.0, -1.75]
      spring_coefficient: 8.0e4
      damping_coefficient: 8.0e4
      free_length: 0.0
    # Hoist rope (tension-only force law via setup ropes: override).
    # Chrono MBS YAML Initialize uses absolute points (local=false).
    - name: crane_hoist
      type: TSDA
      body1: jib_head
      body2: payload
      point1: [33.520718, 0.000000, 17.442769]
      point2: [33.520718, 0.000000, 12.442769]
      spring_coefficient: 0.0
      damping_coefficient: 0.0
      free_length: 5.0000

  # DP heading-hold proxy (torsional spring about world +z at CoG).
  rsdas:
    - name: station_keeping_yaw
      type: RSDA
      body1: ground
      body2: body1
      location: [0.000000, 0.000000, -1.750000]
      axis: [0.0, 0.0, 1.0]
      spring_coefficient: 5.000e+07
      damping_coefficient: 5.000e+07
      free_angle: 0.0

  motors:
