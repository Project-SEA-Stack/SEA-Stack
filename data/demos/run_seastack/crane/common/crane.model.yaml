      type: ROTATION
      body1: body1
      body2: pedestal
      location: [15.000000, 0.000000, 3.500000]
      axis: [0.0, 0.0, 1.0]
      spindle: REVOLUTE
      actuation_type: POSITION
      actuation_function:
        type: CONTROLLER

    - name: crane_luff
      type: ROTATION
      body1: pedestal
      body2: boom
      location: [15.000000, 0.000000, 8.000000]
      axis: [0.000000, 1.000000, 0.000000]
      spindle: REVOLUTE
      actuation_type: POSITION
      actuation_function:
        type: CONTROLLER

    - name: crane_knuckle
      type: ROTATION
      body1: boom
      body2: jib
      location: [19.539905, 0.000000, 16.910065]
      axis: [0.000000, 1.000000, 0.000000]
      spindle: REVOLUTE
      actuation_type: POSITION
      actuation_function:
        type: CONTROLLER

  joints:
    - name: jib_tip_lock
      type: LOCK
      body1: jib
      body2: jib_head
      location: [33.520718, 0.000000, 17.642769]

