# Crane flexible-jib demo -- support vessel metadata
# Generated by generate_vessel.py; edit the script, not this file, to change geometry.

units: m/SI
axes: z-up, waterline z=0

hull:
  length_m: 50.0
  beam_m: 12.0
  draft_m: 3.5
  freeboard_m: 3.5
  cog_z: -1.75
  hull_to_body_z_offset: 5.25  # deck z - cog_z in body frame

crane_seat_body_local: [15.0, 0.0, 5.25]

platform:
  deck_world: [20.0, 16.0, 8.0]
  gap_notes: >
    Platform centre at (20.0, 16.0) m
    world/BEM frame.  Approx. -5.0 m aft of vessel stern (x=+L/2=25.0)
    and 16.0 m to starboard of centreline.  ~16.8 m
    centre-to-centre offset; crane boom must span the gap for lift-off.

sea_state:
  water_depth_m: 40.0
