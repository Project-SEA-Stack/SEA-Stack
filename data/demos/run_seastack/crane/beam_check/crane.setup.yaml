# Flexible-jib check -- generated by assets/build_crane_case.py.
# Parked crane in calm water with the payload hanging on the hoist rope. There
# is no controller, so the slew and luff motors hold their parked angles.
# The ropes file needs run_seastack built with -DSEASTACK_ENABLE_EXTERNAL=ON.
model_file: ../common/crane.model.fea.yaml
simulation_file: crane.simulation.yaml
hydro_file: crane.hydro.yaml
structure_file: ../common/crane.structure.yaml
ropes_file: ../common/crane.ropes.yaml
output_directory: outputs

output:
  level: standard
  decimation: 50

# Fails the run if, at t = 8 s, the jib mate reactions along gravity differ
# from the jib weight by more than 5 %.
checks:
  - type: structure_static_load_path
    time_s: 8.0
    tolerance_percent: 5.0
