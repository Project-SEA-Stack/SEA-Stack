# Generated by assets/build_crane_case.py -- beam_check.
# FEA needs a direct solver (SPARSE_LU), not an iterative VI solver.
chrono-version: 10.0

simulation:
  contact_method: SMC

  time_step: 0.001
  end_time: 10.0
  enforce_realtime: false
  gravity: [0, 0, -9.81]

  integrator:
    type: EULER_IMPLICIT_LINEARIZED
    time_step: 0.001

  solver:
    type: SPARSE_LU
    lock_sparsity_pattern: true

  visualization:
    type: MODEL_FILE
    render_fps: 30
    camera:
      vertical: Z
      location: [32.0, -22.0, 16.0]
      target: [17.0, 8.0, 7.0]
