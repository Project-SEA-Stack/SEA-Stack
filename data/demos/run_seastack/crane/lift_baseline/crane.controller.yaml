# Generated by assets/build_crane_case.py -- edit the generator, not this file.
# External controller (preview); see docs/extending/CONTROLLERS.md.
#
# Every tick (1 kHz) SEA-Stack sends the sensor channels below to
# crane_controller.py and applies the actuator values it returns.
command: [python, ../assets/crane_controller.py]   # relative to this file
control_dt: 0.001     # [s] = time_step: the IK and winch run every step
timeout_ms: 60000

sensors:
  bodies: [body1, jib_head, payload]
  # body.<name>.pos_* [m], quat_* [-], vel_* [m/s], ang_vel_* [rad/s], world frame
  motors: [crane_slew, crane_luff, crane_knuckle]
  # motor.<name>.angle [rad], angle_dt [rad/s], torque [N*m] (Chrono motor angle)
  tsdas: [crane_hoist]
  # tsda.crane_hoist.length / rest_length [m], length_dt [m/s],
  # force [N] (negative in tension; the rope law is in common/crane.ropes.yaml)

actuators:
  motors: [crane_slew, crane_luff, crane_knuckle]
  # motor.<name>.angle [rad] and angle_dt [rad/s]: set-points sent as -q, -dq/dt
  # (the controller's joint angle q is minus the Chrono motor angle)
  tsdas: [crane_hoist]
  # tsda.crane_hoist.rest_length [m]: winch pay-out

config:
  enabled: true
  mode: open_loop
  diagnostics_csv: outputs/crane_diagnostics.csv   # relative to this file
  payload_mass_kg: 3000.0
  payload_body: payload
  jib_head_body: jib_head
  vessel_body: body1
  target_world: [20.000000, 16.000000, 8.600000]
  layout:
    present: true
    pivot_vessel_local: [15.000000, 0.000000, 9.750000]
    boom_dir0_vessel_local: [0.453990, 0.000000, 0.891007]
    jib_dir0_vessel_local: [0.998630, 0.000000, 0.052336]
    slew_axis_vessel_local: [0.0, 0.0, 1.0]
    luff_axis_parked_vessel_local: [0.000000, 1.000000, 0.000000]
    boom_length_m: 10.0
    jib_length_m: 14.0
    hold_tip_xy_world: [33.520718, 0.000000]
    target_tip_xy_world: [20.000000, 16.000000]
    payload_z_hold_m: 11.842769
    payload_z_land_m: 8.6
  motors:
    slew: { name: crane_slew }
    luff: { name: crane_luff }
    knuckle: { name: crane_knuckle }
  hoist:
    tsda_name: crane_hoist
    initial_rest_length_m: 5.0000
    pay_rate_max_m_s: 1.5
    tension_min_frac: 0.0
    attach_point_head_local: [0.000000, 0.000000, -0.200000]
    attach_point_payload_local: [0.000000, 0.000000, 0.600000]
  limits:
    slew_rate_rad_s: 0.18
    luff_rate_rad_s: 0.2
    knuckle_rate_rad_s: 0.18
    joint_accel_rad_s2: 0.4
    max_travel_rad: 2.2
    filter_tau_s: 0.10
    lead_time_s: 0.12
    antisway_max_m: 1.5
  gains:
    antisway_zeta: 0.0
    antisway_leak_s: 0.0
  schedule:
    hold_end_s: 8.0
    move_end_s: 28.0
    settle_end_s: 34.0
    lower_end_s: 42.0
    setdown_end_s: 50.0
    final_clearance_m: 0.25
    setdown_depth_m: 0.3
