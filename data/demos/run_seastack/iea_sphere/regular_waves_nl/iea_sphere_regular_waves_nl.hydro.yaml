hydrodynamics:
  bodies:
    - name: body1
      h5_file: ../assets/hydroData/sphere.h5
      mesh_file: ../assets/geometry/sphere.obj
      # Mesh buoyancy against the calm waterplane z = 0. Wave excitation stays
      # linear, so this is only valid while the relative motion stays well
      # below the draft and freeboard (5 m here). The comparison test
      # test_compare_linear_vs_nonlinear_hs_sphere_reg runs this case against
      # linear hydrostatics and nonlinear Froude-Krylov.
      wetted_surface: calm_water

  waves:
    type: regular
    height: 2.0
    period: 8.0
    direction: 0
    ramp_duration: 20.0
