chrono-version: 10.0

# IEA sphere (radius 5 m, half submerged) hanging from a winch rope.
# The rope is a linear TSDA from a fixed point 30 m above the sphere centre;
# the external controller (winch.controller.yaml) hauls it in by changing its
# rest length. Heave only (prismatic joint).
#
# The sphere starts at its hydrostatic equilibrium, z = -2 m (the centre of
# gravity in sphere.h5, as in the decay cases), so the rope is taut but
# unloaded until the winch hauls in.

model:
  name: iea_sphere_winch_model
  angle_degrees: false

  data_path:
    type: RELATIVE
    root: "."

  bodies:
    - name: body1
      location: [0, 0, -2.0]
      mass: 261800
      fixed: false
      inertia:
        moments: [999, 999, 999]
        products: [0, 0, 0]
      com:
        location: [0, 0, 0]
        orientation: [0, 0, 0]
      visualization:
        shapes:
          - type: SPHERE
            radius: 5.0
            location: [0, 0, 0]
            color: [0.3, 0.1, 0.1]

    - name: ground
      location: [0, 0, 0]
      mass: 999
      fixed: true
      inertia:
        moments: [999, 999, 999]
        products: [0, 0, 0]
      com:
        location: [0, 0, 0]
        orientation: [0, 0, 0]

  joints:
    - name: motion_constraint_heave
      type: PRISMATIC
      body1: ground
      body2: body1
      location: [0, 0, 0]
      axis: [0, 0, 1]

  tsdas:
    # Rope: linear spring-damper (it can also push; the haul keeps it in
    # tension). Points are in the world frame. free_length = initial length,
    # so the rope carries no load until the winch hauls in.
    - name: winch_rope
      type: TSDA
      body1: ground
      body2: body1
      point1: [0, 0, 28]
      point2: [0, 0, -2]
      spring_coefficient: 770000.0   # k [N/m], about the heave hydrostatic stiffness
      damping_coefficient: 300000.0  # c [N s/m]
      free_length: 30.0
      visualization:
        type: SPRING
        radius: 0.2
        resolution: 80
        turns: 20
