# Same integrator, solver and dt as ../bridge; 15 s so the hulls and bridge
# settle before the 10 s load-path check.
chrono-version: 10.0

simulation:
  contact_method: SMC

  time_step: 0.005
  end_time: 15.0
  enforce_realtime: false
  gravity: [0, 0, -9.81]

  integrator:
    type: EULER_IMPLICIT_LINEARIZED
    time_step: 0.005

  solver:
    type: SPARSE_LU
    lock_sparsity_pattern: true

  visualization:
    type: MODEL_FILE
    render_fps: 50
    enable_shadows: true
    camera:
      vertical: Z
      location: [-25, -18, 12]
      target: [0, 0, 3]
