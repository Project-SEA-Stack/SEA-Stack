# SMC + Euler implicit linearized + SPARSE_LU, chosen for tire/deck contact.
# dt = 1e-3 s is set by that contact; the same step also handles the FEA girder
# without full HHT iteration.
chrono-version: 10.0

simulation:
  contact_method: SMC

  time_step: 0.001
  end_time: 30.0
  enforce_realtime: false
  gravity: [0, 0, -9.81]

  integrator:
    type: EULER_IMPLICIT_LINEARIZED
    time_step: 0.001

  solver:
    type: SPARSE_LU
    lock_sparsity_pattern: true

  visualization:
    type: MODEL_FILE
    render_fps: 50
    enable_shadows: true
    camera:
      vertical: Z
      location: [-45, -30, 22]
      target: [0, 0, 2]
