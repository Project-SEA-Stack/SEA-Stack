# SMC + Euler implicit linearized + SPARSE_LU (FEA needs a direct solver).
# dt = 5 ms: against 1 ms, relative heave changes by 0.3 %, and peak girder
# moment, bearing reactions and the load-path check by < 0.1 %. The vehicle
# case needs 1 ms for tyre contact; this case has none. Implicit Euler adds
# omega*dt/2 = 3.5 % damping to the bridge's 2.25 Hz first mode at this dt.
chrono-version: 10.0

simulation:
  contact_method: SMC

  time_step: 0.005
  end_time: 30.0
  enforce_realtime: false
  gravity: [0, 0, -9.81]

  integrator:
    type: EULER_IMPLICIT_LINEARIZED
    time_step: 0.005

  solver:
    type: SPARSE_LU
    lock_sparsity_pattern: true

  visualization:
    type: MODEL_FILE
    render_fps: 50
    enable_shadows: true
    camera:
      vertical: Z
      location: [-30, -22, 14]
      target: [0, 0, 2]
