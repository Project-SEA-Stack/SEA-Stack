# Two 50 m Wigley hulls abeam at y = +/-10 m (8 m clear gap).
# Mass / inertia / CoG z match ../assets/hydroData/ship2ship.h5.
# The linkspan bridge and its deck planks come from
# ship2ship_bridge.structure.yaml. No deck contact: nothing drives on the
# bridge in this case (the vehicle case adds deck collision boxes back).
chrono-version: 10.0

model:
  name: ship2ship_bridge
  angle_degrees: false

  data_path:
    type: RELATIVE
    root: "."

  bodies:
    - name: ground
      location: [0.0, 0.0, 0.0]
      fixed: true

    # Starboard hull (H5 body1).
    - name: body1
      location: [0.0, -10.0, -1.75]
      orientation: [0.0, 0.0, 0.0]
      mass: 956667.0
      fixed: false
      inertia:
        moments: [16875600.0, 149479167.0, 149479167.0]
        products: [0.0, 0.0, 0.0]
      com:
        location: [0.0, 0.0, 0.0]
        orientation: [0.0, 0.0, 0.0]
      visualization:
        model_file: ../assets/geometry/hull.obj
        shape_location: [0.0, 0.0, 1.75]
        color: [0.85, 0.72, 0.12]

    # Port hull (H5 body2).
    - name: body2
      location: [0.0, 10.0, -1.75]
      orientation: [0.0, 0.0, 0.0]
      mass: 956667.0
      fixed: false
      inertia:
        moments: [16875600.0, 149479167.0, 149479167.0]
        products: [0.0, 0.0, 0.0]
      com:
        location: [0.0, 0.0, 0.0]
        orientation: [0.0, 0.0, 0.0]
      visualization:
        model_file: ../assets/geometry/hull.obj
        shape_location: [0.0, 0.0, 1.75]
        color: [0.85, 0.72, 0.12]

  # Soft horizontal station keeping (a DP proxy), same as ../transfer_hulls.
  tsdas:
    - name: station_keeping_body1
      type: TSDA
      body1: ground
      body2: body1
      point1: [0.0, -10.0, -1.75]
      point2: [0.0, -10.0, -1.75]
      spring_coefficient: 5.0e4
      damping_coefficient: 5.0e4
      free_length: 0.0
    - name: station_keeping_body2
      type: TSDA
      body1: ground
      body2: body2
      point1: [0.0, 10.0, -1.75]
      point2: [0.0, 10.0, -1.75]
      spring_coefficient: 5.0e4
      damping_coefficient: 5.0e4
      free_length: 0.0
