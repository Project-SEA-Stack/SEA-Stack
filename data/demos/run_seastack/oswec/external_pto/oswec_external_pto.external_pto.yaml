# Out-of-process linear damper attached to ChLinkRSDA "PTO".
# Requires SEA-Stack built with -DSEASTACK_ENABLE_EXTERNAL=ON and Python 3.
# Same script as RM3 TSDA; here velocity is [rad/s] and force() returns torque [N·m].
# Baseline c matches the native RSDA in tests/regression/oswec (12e6 N·m·s/rad).
link: PTO
command: ["python", "linear_damper_pto.py"]
timeout_ms: 20000
config:
  damping: 12000000
