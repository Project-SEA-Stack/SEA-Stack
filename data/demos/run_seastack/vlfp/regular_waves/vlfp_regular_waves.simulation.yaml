chrono-version: 10.0

simulation:
  contact_method: SMC
  time_step: 0.01
  end_time: 200.0
  enforce_realtime: false
  gravity: [0, 0, -9.81]

  integrator:
    type: HHT
    rel_tolerance: 1e-4
    abs_tolerance_states: 1e-4
    abs_tolerance_multipliers: 1e2
    max_iterations: 50
    use_stepsize_control: false
    use_modified_newton: false

  solver:
    # SPARSE_LU matches long multibody demos (e.g. 5sa spreading); GMRES can fail
    # to converge tightly on this 6-body + coupled RIRF system.
    type: SPARSE_LU

  visualization:
    type: MODEL_FILE
    render_fps: 60
    enable_shadows: false
    camera:
      vertical: Z
      location: [-60.0, 29.0, 25.0]
      target: [87.0, 29.0, 0.0]
