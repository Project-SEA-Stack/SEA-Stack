hydrodynamics:
  bodies:
    - name: body1
      h5_file: ../assets/hydroData/rm3.h5
    - name: body2
      h5_file: ../assets/hydroData/rm3.h5

  waves:
    type: irregular
    depth: 50.0
    height: 2.0
    period: 8.0
    direction: 0
    spectrum: jonswap
    gamma: 3.3
    ramp_duration: 60.0
    seed: 42
    discretization:
      n_omega: 512
  radiation:
    method: rirf_convolution
    smoothing:
      type: sg
      window_length: 5
    taper:
      start_percent: 0.85
      end_percent: 1.0
      final_amplitude: 0.0
    diagnostics:
      export_csv: true
