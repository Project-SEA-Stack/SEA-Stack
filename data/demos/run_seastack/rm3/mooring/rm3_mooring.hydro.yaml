hydrodynamics:
  bodies:
    - name: body1
      h5_file: ../assets/hydroData/rm3.h5

    - name: body2
      h5_file: ../assets/hydroData/rm3.h5

  waves:
    type: irregular
    eta_file: eta_rm3_mooring.txt
    depth: 50.0
    ramp_duration: 40.0
    ramp_type: cosine
    # Eta-file DFT resolution. The 3600 s record has 3597 Fourier bins in the
    # default band; the eta-import default cap (1000) would keep only every
    # 4th bin and about 24% of the wave variance. Keep this >= 3597.
    nfrequencies: 4000

  excitation:
    truncation_time: 20.0

  moordyn:
    enabled: true
    input_file: ../assets/mooring/lines_rm3.txt
    bodies: [body2]
