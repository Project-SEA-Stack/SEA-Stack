hydrodynamics:
  bodies:
    - name: body1
      h5_file: ../assets/hydroData/rm3.h5

    - name: body2
      h5_file: ../assets/hydroData/rm3.h5

  waves:
    type: irregular
    eta_file: eta_rm3_mooring.txt
    depth: 50.0
    ramp_duration: 40.0
    ramp_type: cosine
    # Eta-file DFT resolution. Pinned to match the regression baseline; the
    # eta-import default (1000 Fourier bins) is otherwise applied by
    # ComponentSampler. See adapters/chrono/src/setup_from_yaml.cpp.
    nfrequencies: 1000

  excitation:
    truncation_time: 20.0

  moordyn:
    enabled: true
    input_file: ../assets/mooring/lines_rm3.txt
    bodies: [body2]
